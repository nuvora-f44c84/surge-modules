name: Sync iRingo Upstream Releases

on:
  schedule:
    # 每周一 11:17（北京时间 / UTC+8）自动巡检上游正式版 Release
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Sync upstream release bundles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_iringo_upstream.py

      - name: Verify iRingo modules and JS bundles
        run: python3 tests/test_iringo_modules.py

      - name: Commit and push if updated
        run: |
          if [ -n "$(git status --porcelain scripts/iringo/ modules/iRingo-*.sgmodule)" ]; then
            git config --local user.name 'nuvora-f44c84'
            git config --local user.email '3013056+nuvora-f44c84@users.noreply.github.com'
            git add scripts/iringo/ modules/iRingo-*.sgmodule
            git commit -m "chore(iringo): sync upstream release bundles"
            git push origin HEAD:main
          else
            echo "No upstream changes detected."
          fi
